[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stores"
version = "11.0.0"
description = "Read-only MCP server exposing Delta Lake and kdb+ discovery/query tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=3.4",
    "pandas",
    "uvicorn",
    "starlette",
    "openbb-deltalake",
    "pykx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.15.22"]

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
