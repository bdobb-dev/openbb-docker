[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-deltalake"
version = "11.0.0"
description = "Delta Lake integration for OpenBB: read stored bars as a provider, and persist any OBBject result to a Delta table."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openbb-core>=1.5.8,<2",
    "deltalake>=1.0",
    "pyarrow>=16",
]

[project.entry-points."openbb_provider_extension"]
deltalake = "openbb_deltalake:deltalake_provider"

[project.entry-points."openbb_obbject_extension"]
deltalake = "openbb_deltalake:ext"

[tool.setuptools.packages.find]
include = ["openbb_deltalake*"]

[project.optional-dependencies]
dev = ["ruff==0.15.22", "pytest"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info", "build", "dist", "tests/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    # Import-outside-toplevel is intentional: lazy imports avoid loading
    # deltalake/pandas/pydantic at module-import time.
    "PLC0415",
]
