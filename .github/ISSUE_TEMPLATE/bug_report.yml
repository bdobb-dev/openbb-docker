name: Bug Report
description: Report a problem in openbb-docker
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Run...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (crash, data loss, unusable)
        - High (major feature broken)
        - Medium (feature impaired, workaround exists)
        - Low (cosmetic, minor annoyance)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234, image tag
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Docker/Compose versions, host architecture, etc.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
