name: ci
on:
  push:
  pull_request:
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrub gate — no private infrastructure details
        run: bash scripts/scrub-check.sh
      - name: Image tags match this release
        run: bash scripts/check-image-tags.sh
      - name: No service shares the sidecar's network namespace
        run: bash scripts/check-no-netns.sh
  key-maint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test key-maint
        working-directory: key-maint
        run: |
          pip install -e .[dev]
          pytest -q
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t openbb-local:ci .
      - name: Boot the API with Basic auth
        run: |
          docker run -d --name api \
            -e OPENBB_API_AUTH=true -e OPENBB_API_USERNAME=ci -e OPENBB_API_PASSWORD=ci-secret \
            openbb-local:ci
          for i in $(seq 1 60); do
            code=$(docker exec api curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6900/widgets.json || true)
            [ "$code" = "401" -o "$code" = "200" ] && break
            sleep 5
          done
      - name: Auth is enforced on the command endpoints (401 without, not-401 with)
        run: |
          # The image patches rest_api.py so Basic auth is app-level middleware,
          # not just the /api/v1 dependency -- so EVERY path is guarded. The
          # metadata assertion below is the one that pins that down; without it
          # nothing in CI would notice the patch silently failing to apply.
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          ep=http://127.0.0.1:6900/api/v1/equity/price/quote
          test "$(probe "$ep")" = "401"
          test "$(probe -u ci:WRONG "$ep")" = "401"
          # 422: credentials accepted, request reached validation (symbol is
          # required). Keeps the check free of any outbound provider call.
          test "$(probe -u ci:ci-secret "$ep")" = "422"
      - name: Metadata is locked too, not just /api/v1
        run: |
          # This is the assertion whose absence let the docs claim for several
          # releases that metadata answered 200 unauthenticated. It did not.
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for ep in /widgets.json /apps.json /openapi.json /agents.json; do
            code=$(probe "http://127.0.0.1:6900$ep")
            echo "  $ep -> $code"
            test "$code" = "401"
          done
      - name: The widget manifest is served
        run: |
          count=$(docker exec api curl -fsS -u ci:ci-secret http://127.0.0.1:6900/widgets.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "widgets: $count"; test "$count" -gt 50
      - name: Keyless data endpoint answers
        run: docker exec api curl -fsS -u ci:ci-secret "http://127.0.0.1:6900/api/v1/equity/price/historical?symbol=AAPL&provider=yfinance" | head -c 120
