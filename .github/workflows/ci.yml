name: ci
on:
  push:
  pull_request:
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrub gate — no private infrastructure details
        run: bash scripts/scrub-check.sh
      - name: Image tags match this release
        run: bash scripts/check-image-tags.sh
      - name: No service shares the sidecar's network namespace
        run: bash scripts/check-no-netns.sh
  key-maint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test key-maint
        working-directory: key-maint
        run: |
          pip install -e .[dev]
          pytest -q
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t openbb-local:ci .
      - name: Boot the API with Basic auth
        run: |
          docker run -d --name api \
            -e OPENBB_API_AUTH=true -e OPENBB_API_USERNAME=ci -e OPENBB_API_PASSWORD=ci-secret \
            openbb-local:ci
          for i in $(seq 1 60); do
            code=$(docker exec api curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6900/widgets.json || true)
            [ "$code" = "401" -o "$code" = "200" ] && break
            sleep 5
          done
      - name: Auth is enforced on the command endpoints (401 without, not-401 with)
        run: |
          # The image patches rest_api.py so Basic auth is app-level middleware,
          # not just the /api/v1 dependency -- so EVERY path is guarded. The
          # metadata assertion below is the one that pins that down; without it
          # nothing in CI would notice the patch silently failing to apply.
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          ep=http://127.0.0.1:6900/api/v1/equity/price/quote
          test "$(probe "$ep")" = "401"
          test "$(probe -u ci:WRONG "$ep")" = "401"
          # 422: credentials accepted, request reached validation (symbol is
          # required). Keeps the check free of any outbound provider call.
          test "$(probe -u ci:ci-secret "$ep")" = "422"
      - name: Metadata is locked too, not just /api/v1
        run: |
          # This is the assertion whose absence let the docs claim for several
          # releases that metadata answered 200 unauthenticated. It did not.
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          for ep in /widgets.json /apps.json /openapi.json /agents.json; do
            code=$(probe "http://127.0.0.1:6900$ep")
            echo "  $ep -> $code"
            test "$code" = "401"
          done
      - name: The widget manifest is served
        run: |
          count=$(docker exec api curl -fsS -u ci:ci-secret http://127.0.0.1:6900/widgets.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "widgets: $count"; test "$count" -gt 50
      - name: Keyless data endpoint answers
        run: docker exec api curl -fsS -u ci:ci-secret "http://127.0.0.1:6900/api/v1/equity/price/historical?symbol=AAPL&provider=yfinance" | head -c 120
      - name: Trading calendar extension tests (inside the image)
        run: |
          # In the image, not a host venv: the router tests boot the real app
          # with every installed extension, so they need the stack's own
          # openbb-core and pandas. The editable reinstall points the already
          # installed package at this checkout and adds pytest + httpx.
          docker run --rm -v "$PWD:/repo" -w /repo/openbb-trading-calendar \
            -e PIP_CONSTRAINT=/repo/extension-constraints.txt \
            --entrypoint sh openbb-local:ci \
            -c 'pip install -q --root-user-action=ignore -e ".[dev]" && pytest -q'
      - name: widgets.json lists the Trading calendar widget, not its data route
        run: |
          docker exec api curl -fsS -u ci:ci-secret http://127.0.0.1:6900/widgets.json | python3 -c '
          import json, sys
          widgets = json.load(sys.stdin)
          table = widgets["calendar_trading_table_custom_obb"]
          assert table["name"] == "Trading calendar" and table["type"] == "table", table
          exchange = next(p for p in table["params"] if p["paramName"] == "exchange")
          assert [o["value"] for o in exchange["options"]] == ["XNYS", "XLON", "XTSE", "XETR", "XTKS", "XHKG"], exchange
          assert not any(w.get("endpoint") == "/api/v1/calendar/trading" for w in widgets.values())
          print("Trading calendar widget listed; /api/v1/calendar/trading excluded")'
      - name: The trading calendar data route answers, behind auth
        run: |
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          ep="http://127.0.0.1:6900/api/v1/calendar/trading?exchange=XNYS&year=2026"
          test "$(probe "$ep")" = "401"
          test "$(probe -u ci:ci-secret "http://127.0.0.1:6900/api/v1/calendar/trading?exchange=ZZZZ&year=2026")" = "404"
          docker exec api curl -fsS -u ci:ci-secret "$ep" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["data"]
          assert data["OperatingMIC"] == "XNYS", data
          assert data["ExchangeHolidays"]["2026-07-03"]["Type"] == "Official", data
          print("XNYS 2026 served")'
      - name: Fundamentals extension tests (inside the image)
        run: |
          # As for the trading calendar: in the image, so the router tests boot
          # the real app with the stack's own openbb-core. SEC is a stand-in in
          # tests/conftest.py; nothing here touches the network.
          docker run --rm -v "$PWD:/repo" -w /repo/openbb-fundamentals \
            -e PIP_CONSTRAINT=/repo/extension-constraints.txt \
            --entrypoint sh openbb-local:ci \
            -c 'pip install -q --root-user-action=ignore -e ".[dev]" && pytest -q'
      - name: The fiscal year end route answers, behind auth, and is not a widget
        run: |
          # The CI container has no SEC_USER_AGENT, so the route must answer 404
          # without asking SEC. That proves it is mounted and guarded, and keeps
          # CI off the network. The live SEC answer is checked by hand (README,
          # "Fiscal year end").
          probe() { docker exec api curl -s -o /dev/null -w '%{http_code}' "$@"; }
          ep="http://127.0.0.1:6900/api/v1/fundamentals/fiscal_year_end?symbol=AAPL"
          test "$(probe "$ep")" = "401"
          test "$(probe -u ci:ci-secret "$ep")" = "404"
          docker exec api curl -sS -u ci:ci-secret "$ep" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body == {"detail": "No fiscal year end for AAPL"}, body
          print("fiscal_year_end: 404 without SEC_USER_AGENT")'
          docker exec api curl -fsS -u ci:ci-secret http://127.0.0.1:6900/widgets.json | python3 -c '
          import json, sys
          widgets = json.load(sys.stdin)
          assert not any(w.get("endpoint") == "/api/v1/fundamentals/fiscal_year_end" for w in widgets.values())
          print("fiscal_year_end excluded from widgets.json")'
