[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-security-master"
version = "11.4.0"
description = "OpenBB router extension: MarketCalendar, exchange details and identity resolution backed by security-master-api"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# openbb-eodhd is NOT listed: it is a sibling in this repo, not on PyPI, and
# the two helpers that use it import it lazily. The image installs it before
# this package (see the root Dockerfile); CI runs these tests without it.
dependencies = ["openbb-core>=1.5.8,<2", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.15.22"]

# The entry-point NAME is the namespace: OpenBB's RouterLoader includes each
# core extension under `/{name}`, so this is what puts the three commands on
# `/api/v1/reference/...` and `obb.reference.*`.
[project.entry-points."openbb_core_extension"]
reference = "openbb_security_master.router:router"

[tool.setuptools.packages.find]
include = ["openbb_security_master*"]

[tool.setuptools.package-data]
openbb_security_master = ["odp_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info", "build", "dist", "tests/__pycache__"]

[tool.ruff.lint]
ignore = [
    # Import-outside-toplevel is intentional: openbb-eodhd and the user
    # service are loaded only when the EODHD-backed command runs.
    "PLC0415",
]
