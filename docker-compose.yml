# OpenBB Platform API behind a Tailscale sidecar — Adventures in OpenBB, Ep. 1–2.
#
# The containers share a private bridge network, openbb-internal. Only the
# sidecar is on the tailnet, so the stack still appears there as ONE node named
# "openbb" — because nothing else has a tailnet presence of its own, not because
# they share a network namespace. NOTHING is published to the LAN and no ports
# are mapped — Tailscale Serve is the only way in:
#
#   https://openbb.<your-tailnet>.ts.net/    (Serve terminates TLS, real LE cert)
#
# From v2.0.0 (Ep. 2) the API enforces HTTP Basic auth, and port 443 MAY be
# published to the public internet via Tailscale Funnel (swap serve.json for
# serve-funnel.json + allow the `funnel` node attribute in your tailnet
# policy — see docs/funnel.md). Lock first, then door: auth is REQUIRED
# before the funnel config exists, by construction.
#
# Before first start:
#   cp ts.env.example ts.env                     # Tailscale auth key, chmod 600
#   cp api-auth.env.example api-auth.env         # REQUIRED: API username/password
#   cp credentials.env.example credentials.env   # optional: provider API keys
#
# Verify after start (see README):
#   from any tailnet device:  https://openbb.<your-tailnet>.ts.net/widgets.json
#                             -> 401 without credentials, 200 with
#   from a SECOND device:     the raw port :6900 must be unreachable
services:
  tailscale:
    image: tailscale/tailscale:v1.98.9
    container_name: openbb-ts
    hostname: openbb
    restart: unless-stopped
    env_file:
      - ./ts.env
    environment:
      - TS_HOSTNAME=openbb
      # MANDATORY. The image defaults to userspace networking, where tailscaled
      # terminates inbound tailnet connections itself and forwards them to
      # 127.0.0.1 — this container's OWN loopback, where nothing listens: the
      # services are on the bridge, not in this namespace. Kernel mode (this,
      # plus the tun device and NET_ADMIN below) gives the node a real interface
      # and lets Serve proxy to each service by name over openbb-internal.
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      # Persist node identity across restarts (otherwise every restart is a
      # brand-new machine joining with a possibly-expired key).
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    networks: [openbb-internal]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # OpenBB Platform REST API. Binds 127.0.0.1 so only Serve can reach it.
  openbb-api:
    build: .
    image: openbb-local:10.0.0
    container_name: openbb-api
    restart: unless-stopped
    networks: [openbb-internal]
    depends_on:
      - tailscale
    command: ["openbb-api", "--host", "0.0.0.0", "--port", "6900"]
    env_file:
      # Provider API keys (optional — keyless providers work with none).
      - path: ./credentials.env
        required: false
      # HTTP Basic auth (OPENBB_API_AUTH / USERNAME / PASSWORD). Funnel can
      # expose this port to the public internet, so this file is REQUIRED on
      # purpose: without it the API would come up unauthenticated.
      - path: ./api-auth.env
        required: true
    # Ep. 10: the kdb+ read-through cache. q runs as its OWN service on
    # openbb-internal (see `kdb:` below) rather than as a child process here.
    #
    # Why it changed: the child-process arrangement bound q to this container's
    # 127.0.0.1, which worked only because every service shared one network
    # namespace -- loopback reached all of them at once. On the bridge each
    # container has its own loopback, so a child q would be visible to
    # openbb-api alone and live-grid's tick recording and unified chart (Ep. 10's
    # headline feature) would silently stop.
    #
    # You can still drop a q binary into ./kdb and set KDB_EMBEDDED=true to
    # spawn a child instead -- the read-through cache works fine that way. It
    # just cannot be shared, so live-grid's chart stays off.
    #
    # Bring your own licence: register with KX, drop kc.lic into ./kdb-license/
    # (git-ignored). Without a reachable q AND a licence, the cache passes
    # through to the upstream provider and the stack runs uncached.
    environment:
      - KDB_EMBEDDED=false
      - KDB_HOST=kdb
      - KDB_PORT=5000
      - KDB_MEMORY_MB=8192
      - KDB_UPSTREAM=eodhd
      - QLIC=/opt/kx-license
    volumes:
      - openbb-data:/root/.openbb_platform
      - ./kdb:/opt/kx:ro
      - ./kdb-license:/opt/kx-license:ro
    # Cache budget (KDB_MEMORY_MB) is 8GB, but q's own -w ceiling is budget *
    # 1.25 = 10GB headroom -- see openbb_kdb/config.py's _WORKSPACE_HEADROOM.
    # Plus OpenBB's own ~2GB, that's ~12GB. Set the cgroup limit below q's -w
    # and the kernel OOM killer takes the whole container down -- API and
    # all -- instead of q hitting -w and dying alone.
    mem_limit: 12g

  # kdb+ (Ep. 10): the read-through cache's q process, as its own service on
  # openbb-internal so both openbb-api and live-grid can reach it by name.
  # KX_PORT with no host binds every interface IN THIS CONTAINER, which on a
  # private bridge means the bridge -- no ports are published, so nothing off
  # this Docker host reaches it.
  #
  # READ THIS BEFORE RUNNING IT. q executes arbitrary q code and has no
  # authentication whatsoever. On the bridge that means any process on this
  # Docker host, and any container you attach to openbb-internal, can execute
  # code inside this container. Under the older shared-namespace arrangement
  # the same was true of every service in that namespace, so the sibling
  # containers are not new -- host processes are. It is never reachable from
  # your LAN or your tailnet, and Serve publishes no route to it. If you run
  # untrusted workloads on this host, do not run this service.
  kdb:
    image: ghcr.io/artcashin/kdb-x:amd64
    container_name: openbb-kdb
    restart: unless-stopped
    networks: [openbb-internal]
    environment:
      - KX_PORT=5000
    volumes:
      - ./kdb-data:/data
      - ./kdb-license:/opt/kx-license:ro
    command: ["/data/startup.q"]

  # OpenBB MCP server (Ep. 6): wraps the same Platform app as openbb-api,
  # in-process, and serves MCP over streamable-http for the AI analyst.
  # On openbb-internal; Serve publishes it on :8443 — tailnet-only, NEVER
  # funneled (it has no auth of its own; do NOT load api-auth.env here —
  # auth on this in-process wrapper breaks its tool calls). Like live-grid and
  # kdb, it is reachable from this Docker host — see the kdb block above.
  # Endpoint path is /mcp (a request to /mcp/ 307-redirects there).
  openbb-mcp:
    build: .
    image: openbb-local:10.0.0
    container_name: openbb-mcp
    restart: unless-stopped
    networks: [openbb-internal]
    depends_on:
      - tailscale
    # --default-categories + --tool-discovery keep the initial tools/list
    # small enough for a local model's context slot: all 219 tools cost
    # ~152k prompt tokens against a 65,536-token slot, which hard-errors
    # EVERY chat request. Discovery mode exposes ~10 tools (~1.4k tokens)
    # and lets the agent activate categories on demand. LOAD-BEARING —
    # removing these flags breaks chat completely (see Ep. 6's gotchas).
    command: ["openbb-mcp", "--host", "0.0.0.0", "--port", "6901",
              "--default-categories", "equity", "--tool-discovery"]
    environment:
      # Neutralize the unconditionally-registered `install_skill` admin tool:
      # its only write target is the bundled skills provider, and an agent
      # reaching this server could otherwise persist files that later agent
      # sessions read as trusted instructions (prompt-injection persistence).
      # No flag suppresses the tool itself; removing its write target is the
      # supported lever.
      - OPENBB_MCP_DEFAULT_SKILLS_DIR=
    env_file:
      - path: ./credentials.env
        required: false
    volumes:
      - openbb-data:/root/.openbb_platform

  # key-maint: the transport-tiered "key status" widget backend (Ep. 3).
  # One process, two servers: a network server on :8447 (published by Serve on
  # :10000 and as the Tailscale Service svc:openbb-keys — tailnet-only; the
  # :10000 funnel that once existed was deliberately removed. It enforces the
  # same Basic auth as the API) and an admin server on a unix socket whose
  # 0700 host directory IS the tier-3 authorization (filesystem access via
  # SSH — no port, no header).
  key-maint:
    build: ./key-maint
    image: openbb-key-maint:10.0.0
    container_name: openbb-key-maint
    restart: unless-stopped
    environment:
      # key-maint's network bind is in Python, not in this file; it defaults to
      # loopback so a compose file that forgets this fails closed. Only the
      # NETWORK server moves -- the admin server is a unix socket and stays off
      # the bridge, with its 0700 host directory as the authorization.
      - KEYMAINT_NETWORK_HOST=0.0.0.0
    networks: [openbb-internal]
    depends_on:
      - tailscale
    volumes:
      - ./credentials.env:/config/credentials.env:ro
      - ./api-auth.env:/config/api-auth.env:ro
      # Admin bind lives here. Create it 0700, owned by the host admin user:
      #   mkdir -p key-maint-admin && chmod 700 key-maint-admin
      - ./key-maint-admin:/config/admin

  # live-grid (Ep. 9; tick recording + unified chart added Ep. 10): OpenBB
  # Workspace live_grid backend streaming EODHD websocket prices. Loopback
  # :6903; Serve publishes it on :6903 — tailnet-only unless you deliberately
  # funnel it (it carries your market-data key and has no auth of its own,
  # so: don't).
  #
  # Build context is the repo ROOT, not ./live-grid: the image now installs
  # the sibling kdb-store/ package (Ep. 10), and a Dockerfile can only COPY
  # paths inside its build context -- ../kdb-store is unreachable from a
  # context rooted at live-grid/.
  live-grid:
    build:
      context: .
      dockerfile: live-grid/Dockerfile
    image: openbb-live-grid:10.0.0
    container_name: openbb-live-grid
    restart: unless-stopped
    # live-grid's bind is baked into its Dockerfile CMD as 127.0.0.1:6903.
    # Override it HERE rather than editing the Dockerfile, so the image keeps
    # defaulting to loopback: a compose file that ever drops this line gets an
    # unreachable container, not one silently exposed on the bridge.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "6903"]
    networks: [openbb-internal]
    depends_on:
      - tailscale
    # Ep. 10: live-grid records the tick stream into the SAME q as openbb-api
    # and aggregates it into bars for the unified chart. Both now reach it at
    # kdb:5000 on openbb-internal. KDB_EMBEDDED=false stays load-bearing:
    # without it this service's default would spawn its own child q, which no
    # one else can see and which would diverge from the shared store.
    # With no reachable q the chart and tick recording simply stay off and
    # /live_grid, /live_grid_ws behave exactly as before Ep. 10.
    environment:
      - LIVE_GRID_CHART=true
      - LIVE_TICK_WINDOW_SECONDS=86400
      - KDB_EMBEDDED=false
      - KDB_HOST=kdb
      - KDB_PORT=5000
      - QLIC=/opt/kx-license
    env_file:
      # EODHD_API_KEY comes from here (the public demo websocket key covers
      # the default watchlist for testing).
      - path: ./credentials.env
        required: false
      # /chart and /series are CLIENTS of openbb-api, which enforces Basic
      # auth (OPENBB_API_AUTH=true, api-auth.env below is `required: true` on
      # that service). Without the SAME credentials here, OPENBB_API_USERNAME
      # is unset, app/openbb_client.py sends no auth header, every historical
      # fetch comes back 401 and the chart renders as an error title. The
      # deleted `cache-chart` service loaded this file for exactly this
      # reason; folding it into live-grid must not drop it.
      - path: ./api-auth.env
        required: true
    volumes:
      - ./kdb-license:/opt/kx-license:ro

  # rss-ticker (Ep. 8): the news wire — polls RSS feeds, streams new articles
  # over a websocket, serves a Bloomberg-style news window widget. Source lives
  # in its own repo; compose builds it from GitHub. Loopback :8088; Serve
  # publishes it on :8088 — tailnet-only, NEVER funneled (under tailscale_auth
  # it trusts the identity header Serve injects, and a funneled request
  # carries none, so it would fail closed — but don't rely on that).
  #
  # Before first start:
  #   cp rss-ticker-config/config.yaml.example rss-ticker-config/config.yaml
  #   cp rss-ticker.env.example rss-ticker.env       # TICKER_ADMIN_KEY
  rss-ticker:
    build: https://github.com/artcashin/rss-ticker.git
    image: rss-ticker:10.0.0
    container_name: openbb-rss-ticker
    restart: unless-stopped
    networks: [openbb-internal]
    depends_on:
      - tailscale
    env_file:
      # TICKER_ADMIN_KEY (writes on /api/feeds). Under tailscale_auth no
      # manifest key or user tokens are needed — identity replaces them.
      - path: ./rss-ticker.env
        required: true
    volumes:
      - ./rss-ticker-config:/config:ro
      - rss-ticker-data:/data

networks:
  # Private to this stack. Docker networks are isolated from each other by
  # default, so this bridge is the boundary the shared namespace used to be.
  # Do NOT set `internal: true` — it blocks egress, and the API exists to make
  # outbound calls to data providers.
  openbb-internal:
    driver: bridge

volumes:
  openbb-data:
  rss-ticker-data:
