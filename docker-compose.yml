# OpenBB Platform API behind a Tailscale sidecar — Adventures in OpenBB, Ep. 1–2.
#
# The tailscale container owns the network namespace; the API joins it, so the
# pair appears on your tailnet as one node named "openbb". NOTHING is published
# to the LAN and no ports are mapped — Tailscale Serve is the only way in:
#
#   https://openbb.<your-tailnet>.ts.net/    (Serve terminates TLS, real LE cert)
#
# From v2.0.0 (Ep. 2) the API enforces HTTP Basic auth, and port 443 MAY be
# published to the public internet via Tailscale Funnel (swap serve.json for
# serve-funnel.json + allow the `funnel` node attribute in your tailnet
# policy — see docs/funnel.md). Lock first, then door: auth is REQUIRED
# before the funnel config exists, by construction.
#
# Before first start:
#   cp ts.env.example ts.env                     # Tailscale auth key, chmod 600
#   cp api-auth.env.example api-auth.env         # REQUIRED: API username/password
#   cp credentials.env.example credentials.env   # optional: provider API keys
#
# Verify after start (see README):
#   from any tailnet device:  https://openbb.<your-tailnet>.ts.net/widgets.json
#                             -> 401 without credentials, 200 with
#   from a SECOND device:     the raw port :6900 must be unreachable
services:
  tailscale:
    image: tailscale/tailscale:v1.98.9
    container_name: openbb-ts
    hostname: openbb
    restart: unless-stopped
    env_file:
      - ./ts.env
    environment:
      - TS_HOSTNAME=openbb
      # MANDATORY. The image defaults to userspace networking, where tailscaled
      # terminates inbound tailnet connections itself and forwards them to
      # 127.0.0.1 — which would make the API reachable AROUND Serve at
      # <node-ip>:6900. Kernel mode (this, plus the tun device and NET_ADMIN
      # below) makes the tailnet IP a real interface, so the 127.0.0.1 socket
      # below is genuinely unreachable from other peers.
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      # Persist node identity across restarts (otherwise every restart is a
      # brand-new machine joining with a possibly-expired key).
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Bridge migration (D3): the sidecar keeps its own
    # netns for WireGuard (unaffected above) and gains a bridge interface so
    # it can resolve the container names Serve now proxies to. tailscaled
    # manipulating routing/iptables while dual-homed is the one genuinely
    # unproven part of the design -- see
    # docs/superpowers/specs/2026-08-27-bridge-network-design.md.
    networks:
      - openbb-internal

  # OpenBB Platform REST API. Binds 127.0.0.1 so only Serve can reach it.
  openbb-api:
    build: .
    # 4.7.2 = the skill-built image (OpenBB 4.7.2, openbb-eodhd 9.5.0 with the
    # full FMP-parity fetcher set — 52 eodhd widgets).
    image: openbb-local:4.7.2
    container_name: openbb-api
    restart: unless-stopped
    # Bridge migration (Layer 1): was `network_mode: service:tailscale`.
    networks:
      - openbb-internal
    depends_on:
      - tailscale
    # `--app/--factory` serves api_app.py's factory instead of the stock
    # Platform app: same API, plus the CORS layer that answers Chrome's
    # Private Network Access preflight so pro.openbb.co can reach a backend
    # the browser classifies as local (see Ep. 2's gotchas, and api_app.py).
    # Bridge migration (Layer 2): --host was 127.0.0.1 -- isolation now comes from
    # openbb-internal not being reachable from outside Docker, not from the
    # bind (see D1's accepted cost in the design doc).
    command: ["openbb-api", "--app", "/opt/api_app.py", "--name", "main", "--factory",
              "--host", "0.0.0.0", "--port", "6900"]
    env_file:
      # Provider API keys (optional — keyless providers work with none).
      - path: ./credentials.env
        required: false
      # HTTP Basic auth (OPENBB_API_AUTH / USERNAME / PASSWORD). Funnel can
      # expose this port to the public internet, so this file is REQUIRED on
      # purpose: without it the API would come up unauthenticated.
      - path: ./api-auth.env
        required: true
    # Ep. 10: the kdb+ read-through cache. This repo ships NO KX software --
    # the licence does not permit redistributing q. Bring your own:
    #
    #   1. Drop a q binary into ./kdb (mounted below at /opt/kx:ro,
    #      KDB_LOCAL_QHOME=/opt/kx) and set KDB_EMBEDDED=true to spawn it as
    #      a CHILD of this container instead of using the kdb service.
    #   2. Or run your own kdb container and set KDB_HOST in credentials.env
    #      -- see credentials.env.example for the platform-specific value
    #      and the bind/publish rules for that setup.
    #
    # Bring your own license too: register with KX, drop kc.lic into
    # ./kdb-license/ (git-ignored). Without a reachable q AND a licence, the
    # cache passes through to the upstream provider and the stack runs
    # uncached.
    environment:
      # q runs as the `kdb` service on openbb-internal (see its block), not as a
      # child of this container: a child would bind this container's own
      # loopback and be invisible to live-grid,
      # which all need the same store. Set KDB_EMBEDDED=true with a q binary in
      # ./kdb to spawn a private child instead -- the read-through cache works,
      # but nothing else can see it.
      - KDB_EMBEDDED=false
      - KDB_HOST=kdb
      - KDB_PORT=5000
      - KDB_MEMORY_MB=8192
      - KDB_UPSTREAM=eodhd
      - QLIC=/opt/kx-license
    volumes:
      - openbb-data:/root/.openbb_platform
      - ./kdb:/opt/kx:ro
      - ./kdb-license:/opt/kx-license:ro
    # Cache budget (KDB_MEMORY_MB) is 8GB, but q's own -w ceiling is budget *
    # 1.25 = 10GB headroom -- see openbb_kdb/config.py's _WORKSPACE_HEADROOM.
    # Plus OpenBB's own ~2GB, that's ~12GB. Set the cgroup limit below q's -w
    # and the kernel OOM killer takes the whole container down -- API and
    # all -- instead of q hitting -w and dying alone.
    mem_limit: 12g

  # kdb+ (Ep. 10): the read-through cache's q, as its own service on
  # openbb-internal so openbb-api and live-grid can
  # all reach the same store by name. KX_PORT with no host binds every interface
  # IN THIS CONTAINER, which on a private bridge means the bridge -- plus the
  # single host-loopback publish below for the websocket tick stream.
  #
  # READ THIS BEFORE RUNNING IT. q executes arbitrary q code and has no
  # authentication whatsoever. On the bridge, any process on this Docker host
  # and any container attached to openbb-internal can execute code inside it.
  # The loopback publish extends that to processes on this host: q IPC shares
  # the port with the websocket stream, so 127.0.0.1:5999 is arbitrary code
  # execution for anything local. Raw IPC is never reachable from your LAN
  # or your tailnet: never widen the bind past 127.0.0.1. Serve DOES publish
  # :5999 on the tailnet (ts-config/serve.json) for the NAS-side EOD flush --
  # that is safe by construction, not an exception: Serve reverse-proxies
  # HTTP only, so what crosses the tailnet is .z.ph's read-only GET routes
  # and the JSON websocket, never the IPC protocol. NEVER funnel it. If you
  # run untrusted workloads on this host, remove the ports block or do not
  # run this service.
  #
  # Needs ./kdb-data/startup.q, which this repo does not ship (kdb-data/ is
  # git-ignored). Without it the container exits and the cache passes through
  # to the upstream provider. Start from kdb-ws/startup.q for a tick cache
  # that also publishes trades to websocket subscribers (see kdb-ws/README.md);
  # bdobb-v2's live chart consumes that stream at ws://127.0.0.1:5999/.
  kdb:
    image: ghcr.io/artcashin/kdb-x:amd64
    container_name: openbb-kdb
    restart: unless-stopped
    networks:
      - openbb-internal
    environment:
      - KX_PORT=5000
    ports:
      - "127.0.0.1:5999:5000"
    volumes:
      - ./kdb-data:/data
      - ./kdb-license:/opt/kx-license:ro
    command: ["/data/startup.q"]


  # OpenBB MCP server (Ep. 6): wraps the same Platform app as openbb-api,
  # in-process, and serves MCP over streamable-http for the AI analyst.
  # Bound to 127.0.0.1; Serve publishes it on :8443 — tailnet-only, NEVER
  # funneled (it has no auth of its own; do NOT load api-auth.env here —
  # auth on this in-process wrapper breaks its tool calls).
  # Endpoint path is /mcp (a request to /mcp/ 307-redirects there).
  openbb-mcp:
    build: .
    # 4.7.2 = the skill-built image (OpenBB 4.7.2, openbb-eodhd 9.5.0), same
    # as openbb-api — the MCP tool set tracks the same provider registry.
    image: openbb-local:4.7.2
    container_name: openbb-mcp
    restart: unless-stopped
    # Bridge migration (Layer 1): was
    # `network_mode: service:tailscale`.
    networks:
      - openbb-internal
    depends_on:
      - tailscale
    # --default-categories + tool discovery keep the initial tools/list
    # small enough for a local model's context slot: all 219 tools cost
    # ~152k prompt tokens against a 65,536-token slot, which hard-errors
    # EVERY chat request. Discovery mode exposes ~10 tools (~1.4k tokens)
    # and lets the agent activate categories on demand. LOAD-BEARING —
    # lose it and chat breaks completely (see Ep. 6's gotchas).
    # Bridge migration (Layer 2): --host was 127.0.0.1.
    command: ["openbb-mcp", "--host", "0.0.0.0", "--port", "6901",
              "--default-categories", "equity"]
    environment:
      # Tool discovery is requested by SETTING, not by the CLI flag, because
      # that flag is a moving target: openbb-mcp-server 1.3.x defaulted
      # discovery ON and spelled the switch `--no-tool-discovery`; 1.4.x
      # flipped the default OFF and spelled it `--tool-discovery`. A pinned
      # image is fine either way, but an unrecognised flag is a hard argparse
      # error, so the flag turns a version bump into a container that will not
      # start. `OPENBB_MCP_ENABLE_TOOL_DISCOVERY` is documented and accepted by
      # BOTH lines, and a setting that stops being read degrades to the default
      # rather than refusing to boot. Verified on the pinned 1.4.1: unset ->
      # enable_tool_discovery=False, "true" -> True.
      - OPENBB_MCP_ENABLE_TOOL_DISCOVERY=true
      # Neutralize the unconditionally-registered `install_skill` admin tool:
      # its only write target is the bundled skills provider, and an agent
      # reaching this server could otherwise persist files that later agent
      # sessions read as trusted instructions (prompt-injection persistence).
      # No flag suppresses the tool itself; removing its write target is the
      # supported lever.
      - OPENBB_MCP_DEFAULT_SKILLS_DIR=
    env_file:
      - path: ./credentials.env
        required: false
    volumes:
      - openbb-data:/root/.openbb_platform


  # key-maint: the transport-tiered "key status" widget backend (Ep. 3).
  # One process, two servers: a network server on loopback :8447 (published by
  # Serve on :10000 and as the Tailscale Service svc:openbb-keys — tailnet-only;
  # the :10000 funnel that once existed was deliberately removed. It enforces
  # the same Basic auth as the API) and an admin server on a unix socket whose
  # 0700 host directory IS the tier-3 authorization (filesystem access via
  # SSH — no port, no header).
  key-maint:
    build: ./key-maint
    image: openbb-key-maint:latest
    container_name: openbb-key-maint
    restart: unless-stopped
    # Bridge migration (Layer 1): was
    # `network_mode: service:tailscale`.
    networks:
      - openbb-internal
    depends_on:
      - tailscale
    # Bridge migration (Layer 2): key-maint's network server was hardcoded to
    # 127.0.0.1 (D5's prerequisite) -- see the KEY_MAINT_HOST commit. Its
    # admin unix-socket server (below) is untouched by this migration.
    environment:
      - KEY_MAINT_HOST=0.0.0.0
    volumes:
      # rw: the tier-3 PUT /keys/{env_var} endpoint rewrites this file (see
      # app/credfile.py's set_value -- it writes in place rather than via
      # tempfile+rename specifically because this is a single-file bind
      # mount, and renaming onto a path that is itself a mountpoint fails
      # with EBUSY).
      - ./credentials.env:/config/credentials.env
      - ./api-auth.env:/config/api-auth.env:ro
      # Admin bind lives here. Create it 0700, owned by the host admin user:
      #   mkdir -p key-maint-admin && chmod 700 key-maint-admin
      #
      # Docker Desktop cannot chmod a unix socket inside a macOS bind mount, so
      # on a Mac this service dies at startup with
      #   OSError: [Errno 22] Invalid argument: '/config/admin/key-maint-admin.sock'
      # The default below is the Linux deployment target and is unchanged --
      # the socket stays on the host, which is what the SSH admin flow in
      # key-maint/README.md connects to. On a Mac, run the stack with
      #   KEY_MAINT_ADMIN=key-maint-admin docker compose up -d
      # to put it on a named volume instead: the service runs, at the cost of
      # the socket no longer being reachable from the host.
      - ${KEY_MAINT_ADMIN:-./key-maint-admin}:/config/admin

  # live-grid (Ep. 9; tick recording + unified chart added Ep. 10): OpenBB
  # Workspace live_grid backend streaming EODHD websocket prices. Loopback
  # :6903; Serve publishes it on :6903 — tailnet-only unless you deliberately
  # funnel it (it carries your market-data key and has no auth of its own,
  # so: don't).
  #
  # Build context is the repo ROOT, not ./live-grid: the image now installs
  # the sibling kdb-store/ package (Ep. 10), and a Dockerfile can only COPY
  # paths inside its build context -- ../kdb-store is unreachable from a
  # context rooted at live-grid/.
  live-grid:
    build:
      context: .
      dockerfile: live-grid/Dockerfile
    image: openbb-live-grid:latest
    container_name: openbb-live-grid
    restart: unless-stopped
    # Bridge migration (Layer 1): was
    # `network_mode: service:tailscale`.
    networks:
      - openbb-internal
    depends_on:
      - tailscale
    # Bridge migration (Layer 2): the image's Dockerfile CMD binds 127.0.0.1 by
    # design -- overridden here rather than rebuilt, per the design doc's
    # Layer 2.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "6903"]
    # Ep. 10: live-grid records the tick stream into the SAME q openbb-api
    # spawns and aggregates it into bars for the unified chart.
    # Bridge migration (Layer 4, not in the original design doc's table -- found
    # while implementing it): KDB_BIND_HOST=kdb is new here. Before this
    # migration, live-grid found openbb-api's spawn via
    # kdb-store/kdb_store/session.py's link 2, hardcoded to 127.0.0.1 and
    # reachable only because both containers shared one network namespace.
    # Off that namespace, link 2 needs an explicit target -- the same
    # openbb-internal alias openbb-api spawns q under.
    # KDB_EMBEDDED=false is load-bearing: without it this service's default
    # (a loopback host spawns its own q) would race openbb-api to bind
    # :5000, and the loser gives up on kdb+ for the life of its process.
    # Exactly one service may own the spawn; openbb-api does. With no
    # reachable q the chart and tick recording simply stay off and
    # /live_grid, /live_grid_ws behave exactly as before Ep. 10.
    environment:
      - LIVE_GRID_CHART=true
      - LIVE_TICK_WINDOW_SECONDS=86400
      - KDB_BIND_HOST=kdb
      # Bridge migration (Layer 4, same class of gap as KDB_BIND_HOST): the
      # default is http://127.0.0.1:6900, which reached openbb-api only under
      # the old shared namespace. On the bridge it must be named -- without
      # this every historical fetch fails and /chart, /series and /ta_chart
      # render "bars unavailable". Takes effect once openbb-api itself is
      # recreated onto openbb-internal (a pre-migration container binds
      # loopback in the tailscale namespace and is unreachable by this name).
      - OPENBB_URL=http://openbb-api:6900
      # TA chart (see docs/superpowers/specs/2026-08-25-ta-chart-widget-design.md).
      # TA_EODHD_MIN_REFETCH_S is a cost guard, not a performance knob: EODHD
      # bills 5 API calls per indicator per request, so an unthrottled live
      # chart would spend a 100k/day budget in under an hour.
      - TA_PUSH_INTERVAL_MS=1000
      - TA_EODHD_MIN_REFETCH_S=60
      # Mount a directory here to add chart macros without rebuilding.
      # - TA_MACRO_DIR=/srv/macros-custom
      - KDB_EMBEDDED=false
      - QLIC=/opt/kx-license
      # The subscription widget needs live-grid's externally-reachable URL, because
      # an iframe widget's endpoint is handed to the client verbatim and must be
      # absolute. Unset -> the widget is omitted from /widgets.json rather than
      # advertised broken. Set it to whatever Tailscale Serve publishes :6903 as.
      # - LIVE_GRID_PUBLIC_URL=https://<your-host>.<your-tailnet>.ts.net:6903
    env_file:
      # EODHD_API_KEY comes from here (the public demo websocket key covers
      # the default watchlist for testing).
      - path: ./credentials.env
        required: false
      # /chart and /series are CLIENTS of openbb-api, which enforces Basic
      # auth (OPENBB_API_AUTH=true, api-auth.env below is `required: true` on
      # that service). Without the SAME credentials here, OPENBB_API_USERNAME
      # is unset, app/openbb_client.py sends no auth header, every historical
      # fetch comes back 401 and the chart renders as an error title. The
      # deleted `cache-chart` service loaded this file for exactly this
      # reason; folding it into live-grid must not drop it.
      - path: ./api-auth.env
        required: true
    volumes:
      - ./kdb-license:/opt/kx-license:ro
      # The durable watchlist (app/watchlist.py) writes /data/watchlist.json
      # and its docstring already assumes "a mount that is not the
      # container's root" -- without this volume, pins silently die with the
      # container and only TTL leases (in-process, also non-durable) keep
      # feeds alive. live-grid-data/ is git-ignored, like kdb-data/.
      - ./live-grid-data:/data
      # The subscription watchlist lives here. live-grid otherwise has no
      # writable mount, so without this a restart would silently empty the list.
      - ./live-grid-data:/data

  # rss-ticker (Ep. 8): the news wire — polls RSS feeds, streams new articles
  # over a websocket, serves a Bloomberg-style news window widget. Source lives
  # in its own repo; compose builds it from GitHub. Loopback :8088; Serve
  # publishes it on :8088 — tailnet-only, NEVER funneled (under tailscale_auth
  # it trusts the identity header Serve injects, and a funneled request
  # carries none, so it would fail closed — but don't rely on that).
  #
  # Before first start:
  #   cp rss-ticker-config/config.yaml.example rss-ticker-config/config.yaml
  #   cp rss-ticker.env.example rss-ticker.env       # TICKER_ADMIN_KEY
  rss-ticker:
    build: https://github.com/artcashin/rss-ticker.git
    image: rss-ticker:8.0.0
    container_name: openbb-rss-ticker
    restart: unless-stopped
    # Bridge migration (Layer 1): was
    # `network_mode: service:tailscale`. Its tailscale_auth guard needed a
    # source change first (rss-ticker's own repo, feat/ticker-server) --
    # bind_host: 0.0.0.0 (rss-ticker-config/config.yaml.example) refused to
    # start before that landed.
    networks:
      - openbb-internal
    depends_on:
      - tailscale
    env_file:
      # TICKER_ADMIN_KEY (writes on /api/feeds). Under tailscale_auth no
      # manifest key or user tokens are needed — identity replaces them.
      - path: ./rss-ticker.env
        required: true
    volumes:
      - ./rss-ticker-config:/config:ro
      - rss-ticker-data:/data


volumes:
  openbb-data:
  rss-ticker-data:
  # Only used when KEY_MAINT_ADMIN names it (see key-maint's admin mount).
  # Declaring it unconditionally costs nothing on the Linux default, where the
  # admin socket stays a host bind mount.
  key-maint-admin:

# Bridge migration (D1): replaces the loopback boundary
# `network_mode: service:tailscale` gave the eight services below. Docker
# networks are isolated by default, so nothing outside this project reaches
# them even though they now bind 0.0.0.0 -- but D1's accepted cost applies:
# any container LATER attached to openbb-internal gets unauthenticated access
# to live-grid, openbb-mcp, and kdb (none of which
# authenticate); rss-ticker is the exception -- it still authenticates via
# tailscale_auth, extended to trust 0.0.0.0 under this same isolation
# guarantee (see rss-ticker's own feat/ticker-server, not this repo). Only
# the seven services docs/superpowers/specs/2026-08-27-bridge-network-
# design.md names were in the original design; rss-ticker's inclusion (and
# its tailscale_auth fix) was a scope decision made while implementing it,
# not in that doc.
networks:
  openbb-internal:
    driver: bridge
