# OpenBB Platform API behind a Tailscale sidecar — Adventures in OpenBB, Ep. 1.
#
# The two containers share a private bridge network, openbb-internal. Only the
# sidecar is on the tailnet, so the pair still appears there as ONE node named
# "openbb" — because the API has no tailnet presence of its own, not because the
# two share a network namespace. NOTHING is published to the LAN and no ports
# are mapped — Tailscale Serve is the only way in:
#
#   https://openbb.<your-tailnet>.ts.net/    (Serve terminates TLS, real LE cert)
#
# Before first start:
#   cp ts.env.example ts.env                 # add your Tailscale auth key, chmod 600
#   cp credentials.env.example credentials.env   # optional: provider API keys
#
# Verify after start (see README):
#   from any tailnet device:  https://openbb.<your-tailnet>.ts.net/widgets.json
#   from a SECOND device:     the raw port :6900 must be unreachable
services:
  tailscale:
    image: tailscale/tailscale:v1.98.9
    container_name: openbb-ts
    hostname: openbb
    restart: unless-stopped
    env_file:
      - ./ts.env
    environment:
      - TS_HOSTNAME=openbb
      # MANDATORY. The image defaults to userspace networking, where tailscaled
      # terminates inbound tailnet connections itself and forwards them to
      # 127.0.0.1 — this container's OWN loopback, where nothing listens: the
      # API is on the bridge, not in this namespace. Kernel mode (this, plus the
      # tun device and NET_ADMIN below) gives the node a real interface and lets
      # Serve proxy to the API by its service name over openbb-internal.
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      # Persist node identity across restarts (otherwise every restart is a
      # brand-new machine joining with a possibly-expired key).
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config
    networks: [openbb-internal]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # OpenBB Platform REST API. Binds 0.0.0.0 on openbb-internal — a private
  # bridge, NOT the LAN. Reachable from the sidecar, so Serve can proxy to it,
  # and from this Docker host; not from the tailnet, not from the LAN.
  # NEVER add a `ports:` block here — that is what would publish it.
  openbb-api:
    build: .
    image: openbb-local:1.0.0
    container_name: openbb-api
    restart: unless-stopped
    networks: [openbb-internal]
    depends_on:
      - tailscale
    command: ["openbb-api", "--host", "0.0.0.0", "--port", "6900"]
    env_file:
      # Provider API keys (optional — keyless providers work with none).
      - path: ./credentials.env
        required: false
    volumes:
      - openbb-data:/root/.openbb_platform

networks:
  # Private to this stack. Docker networks are isolated from each other by
  # default, so this bridge is the boundary the shared namespace used to be.
  # Do NOT set `internal: true` — it blocks egress, and the API exists to make
  # outbound calls to data providers.
  openbb-internal:
    driver: bridge

volumes:
  openbb-data:
