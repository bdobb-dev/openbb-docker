[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-eodhd"
version = "9.5.0"
description = "EODHD provider extension for OpenBB (equity/crypto/currency historical, fundamentals, corporate actions, ownership, insider trading, analyst estimates)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "openbb-core>=1.5.8,<2",
    # Official EODHD SDK, pinned to a GitHub commit (main, 2026-07-28): the
    # PyPI release (1.0.32) predates the SDK's typed errors (it can sys.exit()
    # on API errors), request timeouts, and the fundamentals `filter` param.
    "eodhd @ https://github.com/EodHistoricalData/EODHD-APIs-Python-Financial-Library/archive/f98e69d797140ca03f16fa7451046d84aab9643e.tar.gz",
]

# Registers the `eodhd` provider with OpenBB's plugin system.
[project.entry-points."openbb_provider_extension"]
eodhd = "openbb_eodhd:eodhd_provider"

[tool.setuptools.packages.find]
include = ["openbb_eodhd*"]

[project.optional-dependencies]
dev = ["ruff==0.15.22", "pytest"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info", "build", "dist", "tests/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    # Import-outside-toplevel is intentional: lazy imports avoid loading
    # heavy deps at module-import time.
    "PLC0415",
]
