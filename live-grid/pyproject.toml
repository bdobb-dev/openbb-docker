[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "live-grid"
version = "9.0.0"
description = "OpenBB Workspace live_grid backend streaming EODHD websocket prices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    # [standard] on purpose: live-grid serves a WebSocket, and bare uvicorn
    # does not depend on `websockets`. It has worked only because something
    # else in the image happened to pull it in -- a transitive accident, and
    # the kind that breaks on an unrelated dependency bump. The v9.6 and v10
    # lines already declare it; v11 and main were missed (openbb-docker #22).
    "uvicorn[standard]>=0.29",
    # Official EODHD SDK, pinned to a GitHub commit: the PyPI release (1.0.32)
    # can sys.exit() on API errors, has no request timeouts, and predates the
    # SDK's typed error handling.
    "eodhd @ https://github.com/EodHistoricalData/EODHD-APIs-Python-Financial-Library/archive/f98e69d797140ca03f16fa7451046d84aab9643e.tar.gz",
    "kdb-store",
    "pandas",
    "httpx>=0.27",
    "polars>=1.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff==0.15.22"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: hits the live EODHD API; deselected by default",
]
addopts = "-m 'not network'"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
