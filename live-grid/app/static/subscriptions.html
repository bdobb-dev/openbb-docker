<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subscriptions</title>
<style>
  /*
   * Both colours are set EXPLICITLY, and that is the point.
   *
   * This page is framed by the desktop client, and a frame whose body sets no
   * background shows the embedder's -- which is white -- while `color-scheme`
   * still hands the UA's dark-mode default text colour. White on white: the
   * page rendered perfectly and read as blank, with only the borders visible.
   * Relying on the UA for one of the pair and not the other is what broke it.
   */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --line: #8883;
    --dim: #8888;
    --bad: #c33;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --bad: #ef5350; }
  }
  body {
    font: 13px/1.5 system-ui, sans-serif;
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--fg);
  }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: currentColor; }
  .count { font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 6px; margin-bottom: 12px; }
  input { flex: 1; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px;
          background: transparent; color: inherit; font: inherit; }
  button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px;
           background: transparent; color: inherit; font: inherit; cursor: pointer; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 14px 0 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 3px 0;
       border-bottom: 1px solid var(--line); }
  li span { flex: 1; font-variant-numeric: tabular-nums; }
  li.leased { color: var(--dim); }
  li.leased em { font-style: normal; font-size: 11px; }
  .err { color: var(--bad); min-height: 1.4em; margin-bottom: 6px; }
  .empty { color: var(--dim); padding: 3px 0; }
</style>
</head>
<body>
<header>
  <h1>EODHD</h1>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <span class="count" id="count">–</span>
</header>
<p class="err" id="err"></p>
<form id="add">
  <input id="sym" placeholder="Add a symbol (AAPL, BTC-USD, EURUSD)" autocomplete="off">
  <button type="submit">Add</button>
</form>
<div id="groups"></div>
<script>
const $ = (id) => document.getElementById(id);

function render(d) {
  $("count").textContent = `${d.used} / ${d.cap}`;
  $("fill").style.width = `${Math.min(100, (d.used / d.cap) * 100)}%`;
  const leased = new Set(d.leased);
  $("groups").innerHTML = "";
  for (const [name, syms] of Object.entries(d.groups)) {
    const h = document.createElement("h2");
    h.textContent = name;
    $("groups").append(h);
    const ul = document.createElement("ul");
    if (!syms.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.textContent = "none";
      ul.append(p);
    }
    for (const s of syms) {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = s;
      li.append(label);
      const b = document.createElement("button");
      b.textContent = "Remove";
      b.onclick = () => call("DELETE", `/api/subscriptions/${encodeURIComponent(s)}`);
      li.append(b);
      ul.append(li);
    }
    $("groups").append(ul);
  }
  // Leases are shown so the budget adds up, but they are not ours to remove --
  // they lapse on their own TTL.
  const held = d.leased.filter((s) => !d.pinned.includes(s));
  if (held.length) {
    const h = document.createElement("h2");
    h.textContent = "Leased by quotes";
    $("groups").append(h);
    const ul = document.createElement("ul");
    for (const s of held) {
      const li = document.createElement("li");
      li.className = "leased";
      li.innerHTML = `<span></span><em>expires on its own</em>`;
      li.querySelector("span").textContent = s;
      ul.append(li);
    }
    $("groups").append(ul);
  }
}

/*
 * Credentials handed over by the host that framed this page.
 *
 * This page is public (it is the one path the auth middleware exempts) but
 * everything it calls is not, because /api/subscriptions mutates durable
 * state. A browser tab needs none of this -- it authenticated to load the
 * page and the browser repeats those credentials on every same-origin
 * request. An IFRAME cannot: it navigates itself, carries no header, and has
 * no credentials to repeat. So the host sends them over postMessage.
 */
let authHeaders = {};

window.addEventListener("message", (e) => {
  // The host replies to our own parent only; anything else is another page
  // talking past us.
  if (e.source !== window.parent) return;
  const d = e.data;
  if (!d || d.type !== "openbb-auth" || typeof d.headers !== "object" || d.headers === null) return;
  authHeaders = d.headers;
  start();
});

// Announce ourselves. The host answers with openbb-auth when it has a
// credential to send, and with the card's parameters either way. Harmless
// when there is no host: a top-level page's parent is itself.
if (window.parent !== window) {
  window.parent.postMessage({ type: "openbb-connect" }, "*");
}

async function call(method, url, body) {
  $("err").textContent = "";
  try {
    const r = await fetch(url, {
      method,
      headers: {
        ...authHeaders,
        ...(body ? { "content-type": "application/json" } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json();
    if (!r.ok) { $("err").textContent = d.detail || `HTTP ${r.status}`; return; }
    render(d);
  } catch (e) {
    $("err").textContent = String(e);
  }
}

$("add").onsubmit = (e) => {
  e.preventDefault();
  const v = $("sym").value.trim();
  if (!v) return;
  $("sym").value = "";
  call("POST", "/api/subscriptions", { symbol: v });
};

/*
 * Load once, then poll -- but not before the credentials arrive.
 *
 * Firing immediately cost a guaranteed 401 on every single load: the first
 * GET went out before the host could answer openbb-connect. `started` makes
 * whichever comes first win, so the handshake is a fast path rather than a
 * precondition.
 *
 * The timer is the fallback for a host that never answers -- one with no
 * credential to send, or a plain browser tab, where the browser supplies its
 * own Basic auth and none of this is needed.
 */
let started = false;

function start() {
  if (started) return;
  started = true;
  call("GET", "/api/subscriptions");
  setInterval(() => call("GET", "/api/subscriptions"), 15000);
}

if (window.parent === window) start();
else setTimeout(start, 1000);
</script>
</body>
</html>
