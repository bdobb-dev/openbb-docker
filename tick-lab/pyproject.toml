[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-lab"
version = "11.1.1"
description = "Read ticks from the shared Delta Lake store, roll them into bars, and check them against another source"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "deltalake>=1.0",
    "pyarrow>=16",
    "pandas>=2.0,<3",  # pandas 3 changed tz_localize's ambiguous/nonexistent
                       # exceptions away from pytz's -- see firstrate.py
    "yfinance>=1.5",
    "requests>=2.31",
]

[project.scripts]
tick-lab = "tick_lab.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.15.22", "pytest"]

[tool.setuptools.packages.find]
include = ["tick_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
